<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div class="edge" id="edge"></div>
  <div class="vignette" id="vignette"></div>

  <div class="ghost" id="ghost"></div>
  <div class="cursor" id="cursor">
    <svg class="arrow" viewBox="0 0 28 32" width="28" height="32">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#d9fff7" />
          <stop offset=".55" stop-color="#62ead3" />
          <stop offset="1" stop-color="#2f9e92" />
        </linearGradient>
      </defs>
      <path d="M2.5 2.2 L2.5 25.5 L8.6 19.8 L12.6 29 L17 27.1 L13 18 L21.5 18 Z" fill="url(#g)" stroke="#0a0a0c" stroke-width="2" stroke-linejoin="round" />
    </svg>
    <div class="tag" id="tag">
      <span class="dot"></span><span class="who">Island</span><span class="act" id="act"></span>
    </div>
    <div class="typing" id="typing"><span id="typed"></span><i class="caret"></i></div>
    <div class="keys" id="keys"></div>
  </div>

  <svg class="trail" id="trail"><line id="trailLine" /></svg>

  <div class="hud" id="hud">
    <div class="orb"></div>
    <div class="hud-text">
      <b>Island is using your PC</b>
      <span id="hudStep">Starting …</span>
    </div>
    <div class="hud-stop">Press <kbd id="hk">Ctrl+Alt+Shift+Esc</kbd> to stop</div>
    <button class="hud-btn" id="hudStop" title="Stop what Island is doing">Stop</button>
  </div>

  <!-- teaching: spotlight on the thing to click, and a coach card with the step -->
  <div class="teach" id="teach">
    <div class="spot" id="spot"><i></i><b></b></div>
    <div class="t-arrow" id="tArrow"><svg viewBox="0 0 40 48" width="40" height="48"><path d="M20 46 L4 26 H14 V2 H26 V26 H36 Z" fill="#62ead3" stroke="#04201c" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
    <div class="good" id="good">Nice!</div>
    <div class="coach" id="coach">
      <div class="c-top"><span class="c-step" id="cStep"></span><span class="c-bar"><i id="cBar"></i></span></div>
      <div class="c-text" id="cText"></div>
      <div class="c-detail" id="cDetail"></div>
      <div class="c-wait" id="cWait"><span class="c-spin"></span>Checking your screen…</div>
      <div class="c-ask" id="cAsk"><textarea id="cAskText" rows="2" placeholder="Type your question, then press Enter"></textarea></div>
      <div class="c-btns" id="cBtns">
        <button class="c-btn main" data-a="done"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>I did it</button>
        <button class="c-btn" data-a="again">Show me again</button>
        <button class="c-btn" data-a="do_it">Do it for me</button>
        <button class="c-btn" data-a="ask">Ask a question</button>
      </div>
      <div class="c-hint" id="cHint"></div>
    </div>
  </div>

  <!-- "Show Island how": the user does a task while Island watches -->
  <div class="rec" id="rec">
    <div class="r-top"><span class="r-dot"></span><b>Island is watching</b><span class="r-count" id="rCount"></span></div>
    <div class="r-text">Do the task the way you always do. Island notes each click and what you type, then can do it for you next time. Passwords are never recorded.</div>
    <ol class="r-steps" id="rSteps"></ol>
    <div class="c-btns" id="rBtns">
      <button class="c-btn main" data-a="rec-done"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Done, save it</button>
      <button class="c-btn" data-a="rec-cancel">Cancel</button>
    </div>
  </div>

  <script src="../renderer/orb.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
